# Supabase Local Development Configuration
project_id = "quickrent-production"

[api]
enabled = true
port = 54321
schemas = ["public", "rentals", "payments", "audit", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://quickrent.com", "http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.captcha]
enabled = false
provider = "turnstile"
secret = "1x0000000000000000000000000000000AA"

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.image_transformation]
enabled = true

[edge_runtime]
enabled = true
port = 54323
inspector_port = 8083
