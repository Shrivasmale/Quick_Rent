name: CD Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Database Migrations
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
        working-directory: ./supabase

      - name: Deploy Edge Function Microservices
        run: |
          supabase functions deploy user-service --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy catalog-service --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy rental-service --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy payment-service --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy notification-service --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
